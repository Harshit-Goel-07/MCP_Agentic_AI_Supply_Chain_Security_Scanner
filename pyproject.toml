[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mcpscan"
version = "0.1.0"
description = "MCP / Agentic-AI tool supply-chain security scanner (tool poisoning, prompt injection, cross-server toxic flows)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MCPScan Contributors" }]
keywords = ["mcp", "security", "scanner", "sarif", "agentic-ai", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12",
    "rich>=13.7",
    "networkx>=3.3",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
semantic = [
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
mcpscan = "mcpscan.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/mcpscan"
Documentation = "https://github.com/your-org/mcpscan#readme"

[tool.hatch.build.targets.wheel]
packages = ["mcpscan"]

[tool.hatch.build.targets.wheel.force-include]
"mcpscan/rules/catalog.yaml" = "mcpscan/rules/catalog.yaml"
"mcpscan/report/templates" = "mcpscan/report/templates"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["mcpscan", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=mcpscan --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["mcpscan/api/*", "mcpscan/cli.py"]
