name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,api,semantic]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy mcpscan
      - name: Test
        run: pytest --cov=mcpscan --cov-report=xml
      - name: Enforce coverage floor
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          assert rate >= 0.80, f"coverage {rate:.2%} < 80%"
          print(f"coverage {rate:.2%} OK")
          PY

  self-scan:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[semantic]"
      - name: Scan example fixtures -> SARIF
        run: mcpscan scan --targets ./examples --format sarif --out mcpscan.sarif --fail-on critical
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mcpscan.sarif

  reproducibility:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e .
      - name: Assert identical findings hash across two runs
        run: |
          mcpscan scan --targets ./examples --format json --out a.json --fail-on critical
          mcpscan scan --targets ./examples --format json --out b.json --fail-on critical
          python - <<'PY'
          import json
          a = json.load(open("a.json")); b = json.load(open("b.json"))
          fa = sorted((f["rule_id"], f.get("tool")) for f in a["findings"])
          fb = sorted((f["rule_id"], f.get("tool")) for f in b["findings"])
          assert fa == fb, "non-deterministic findings"
          print("deterministic OK")
          PY
